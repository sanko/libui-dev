name: Unified Tester

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      platform_name:
        required: true
        type: string
      runner_type:
        required: true
        type: string
      os:
        required: true
        type: string
      os_version:
        required: false
        type: string
      arch:
        required: true
        type: string
      prepare:
        required: false
        type: string
      host_os:
        required: false
        type: string
      toolchain:
        required: true
        type: string

env:
  CODECOV_TOKEN: '${{ secrets.CODECOV_TOKEN }}'

jobs:
  build-and-test:
    name: ${{ inputs.arch }}-${{ inputs.toolchain }}
    runs-on: ${{ inputs.host_os || inputs.os }}
    strategy:
      fail-fast: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6.0.0

      - name: Setup MSVC
        if: inputs.toolchain == 'msvc'
        uses: TheMrMilchmann/setup-msvc-dev@v4.1.0
        with:
          arch: ${{ inputs.arch == 'aarch64' && 'arm64' || 'x64' }}

      - name: Build and Test on Direct Runner
        if: inputs.runner_type == 'direct'
        shell: bash
        run: |
          ${{ inputs.prepare }}
          if [ "${{ inputs.toolchain }}" = 'msvc' ]; then
            cmd.exe /d /c "python -m pip install meson ninja && meson setup _build --buildtype=release --default-library=static && meson compile -C _build && meson test -C _build"
          else
            python3 -m pip install meson ninja || python3 -m pip install --break-system-packages meson ninja || python -m pip install meson ninja
            sudo apt-get update -y && sudo apt-get install -y libgtk-3-dev xvfb || true
            meson setup _build --buildtype=release --default-library=static && meson compile -C _build && if command -v xvfb-run >/dev/null 2>&1; then xvfb-run meson test -C _build; else meson test -C _build; fi
          fi

      - name: Build and Test in FreeBSD
        if: inputs.runner_type == 'vm' && inputs.os == 'freebsd'
        uses: vmactions/freebsd-vm@v1.5.2
        with:
          release: ${{ inputs.os_version }}
          usesh: true
          arch: ${{ inputs.arch }}
          prepare: ${{ inputs.prepare }}
          run: |
            pkg install -y meson gtk3 pkgconf
            meson setup _build --buildtype=release --default-library=static && meson compile -C _build

      - name: Build and Test in OpenBSD
        if: inputs.runner_type == 'vm' && inputs.os == 'openbsd'
        uses: vmactions/openbsd-vm@v1.4.5
        with:
          release: ${{ inputs.os_version }}
          usesh: true
          arch: ${{ inputs.arch }}
          prepare: ${{ inputs.prepare }}
          run: |
            pkg_add meson gtk+3
            meson setup _build --buildtype=release --default-library=static && meson compile -C _build

      - name: Build and Test in NetBSD
        if: inputs.runner_type == 'vm' && inputs.os == 'netbsd'
        uses: vmactions/netbsd-vm@v1.4.5
        with:
          release: ${{ inputs.os_version }}
          usesh: true
          arch: ${{ inputs.arch }}
          prepare: ${{ inputs.prepare }}
          run: |
            /usr/sbin/pkg_add meson gtk3+ pkgconf x11 libXext libXrender xproto libxcb
            export PKG_CONFIG_PATH=/usr/pkg/lib/pkgconfig:/usr/X11R7/lib/pkgconfig
            meson setup _build --buildtype=release --default-library=static && meson compile -C _build

      - name: Build and Test in DragonflyBSD
        if: inputs.runner_type == 'vm' && inputs.os == 'dragonflybsd'
        uses: vmactions/dragonflybsd-vm@v1.3.1
        with:
          release: ${{ inputs.os_version }}
          usesh: true
          prepare: ${{ inputs.prepare }}
          run: |
            pkg install -y meson gtk3 pkgconf
            meson setup _build --buildtype=release --default-library=static && meson compile -C _build

      - name: Build and Test in Solaris
        if: inputs.runner_type == 'vm' && inputs.os == 'solaris'
        uses: vmactions/solaris-vm@v1.3.8
        with:
          release: ${{ inputs.os_version }}
          usesh: true
          prepare: ${{ inputs.prepare }}
          run: |
            export PKG_CONFIG_PATH=/usr/lib/64/pkgconfig
            pkg install -v --accept meson gtk3 developer/build/pkg-config
            meson setup _build --buildtype=release --default-library=static && meson compile -C _build

      #~ - name: Upload coverage reports to Codecov
        #~ uses: codecov/codecov-action@v5
        #~ with:
          #~ token: ${{ secrets.CODECOV_TOKEN }}
          #~ root_dir: src
          #~ flags: ${{inputs.os}}, ${{inputs.arch}}, ${{ inputs.toolchain }}
          #~ name: ${{ inputs.platform_name }}-${{ inputs.arch }}-${{ inputs.toolchain }}
          #~ verbose: true

      - name: Record Build Status
        if: always()
        shell: bash
        run: echo ${{ job.status }} > ${{ inputs.platform_name }}-${{ inputs.arch }}-${{ inputs.toolchain }}.result

      - name: Upload Build Status Artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: result-artifact-${{ inputs.platform_name }}-${{ inputs.arch }}-${{ inputs.toolchain }}
          path: ${{ inputs.platform_name }}-${{ inputs.arch }}-${{ inputs.toolchain }}.result
          retention-days: 1
