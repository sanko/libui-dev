name: Unified Tester

permissions:
  contents: read

on:
  workflow_call:
    inputs:
      platform_name:
        required: true
        type: string
      runner_type:
        required: true
        type: string
      os:
        required: true
        type: string
      os_version:
        required: false
        type: string
      arch:
        required: true
        type: string
      prepare:
        required: false
        type: string
      host_os:
        required: false
        type: string
      toolchain:
        required: true
        type: string
      link_type:
        required: true
        type: string

env:
  CODECOV_TOKEN: '${{ secrets.CODECOV_TOKEN }}'

jobs:
  build-and-test:
    name: ${{ inputs.arch }}-${{ inputs.toolchain }}-${{ inputs.link_type }}
    runs-on: ${{ inputs.host_os || inputs.os }}
    strategy:
      fail-fast: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@v6.0.0

      - name: Setup MSVC
        if: inputs.toolchain == 'msvc'
        uses: TheMrMilchmann/setup-msvc-dev@v4.1.0
        with:
          arch: ${{ inputs.arch == 'aarch64' && 'arm64' || 'x64' }}

      - name: Build and Test on Direct Runner
        if: inputs.runner_type == 'direct'
        shell: bash
        run: |
          ${{ inputs.prepare }}
          if [ "${{ inputs.toolchain }}" = 'msvc' ]; then
            cmd.exe /d /c "cmake -S . -B _build -A ${{ inputs.arch == 'aarch64' && 'arm64' || 'x64' }} -DLIBUI_COMPILE_EXAMPLES=ON -DLIBUI_BUILD_SHARED=${{ inputs.link_type == 'shared' && 'ON' || 'OFF' }} && cmake --build _build --config Release && ctest --test-dir _build -C Release"
          elif [[ "${{ inputs.os }}" == windows* ]]; then
            # MinGW toolchain from the `choco install mingw` prepare step
            export PATH="/c/ProgramData/mingw64/mingw64/bin:$PATH"
            if [ "${{ inputs.toolchain }}" = 'clang' ]; then
              export CC=clang
              export CXX=clang++
            else
              export CC=gcc
              export CXX=g++
            fi
            cmake -S . -B _build -G "MinGW Makefiles" -DCMAKE_BUILD_TYPE=Release -DLIBUI_COMPILE_EXAMPLES=ON -DLIBUI_BUILD_SHARED=${{ inputs.link_type == 'shared' && 'ON' || 'OFF' }}
            cmake --build _build
            ctest --test-dir _build
          else
            sudo apt-get update -y && sudo apt-get install -y libgtk-3-dev xvfb || true
            command -v cmake >/dev/null 2>&1 || python3 -m pip install cmake || python3 -m pip install --break-system-packages cmake || python -m pip install cmake
            cmake -S . -B _build -DCMAKE_BUILD_TYPE=Release -DLIBUI_COMPILE_EXAMPLES=ON -DLIBUI_BUILD_SHARED=${{ inputs.link_type == 'shared' && 'ON' || 'OFF' }}
            cmake --build _build
            if command -v xvfb-run >/dev/null 2>&1; then xvfb-run ctest --test-dir _build; else ctest --test-dir _build; fi
          fi

      - name: Build and Test in FreeBSD
        if: inputs.runner_type == 'vm' && inputs.os == 'freebsd'
        uses: vmactions/freebsd-vm@v1.5.2
        with:
          release: ${{ inputs.os_version }}
          usesh: true
          arch: ${{ inputs.arch }}
          prepare: ${{ inputs.prepare }}
          run: |
            pkg install -y cmake gtk3 pkgconf
            cmake -S . -B _build -DCMAKE_BUILD_TYPE=Release -DLIBUI_COMPILE_EXAMPLES=ON && cmake --build _build

      - name: Build and Test in OpenBSD
        if: inputs.runner_type == 'vm' && inputs.os == 'openbsd'
        uses: vmactions/openbsd-vm@v1.4.5
        with:
          release: ${{ inputs.os_version }}
          usesh: true
          arch: ${{ inputs.arch }}
          prepare: ${{ inputs.prepare }}
          run: |
            pkg_add cmake gtk+3
            cmake -S . -B _build -DCMAKE_BUILD_TYPE=Release -DLIBUI_COMPILE_EXAMPLES=ON && cmake --build _build

      - name: Build and Test in NetBSD
        if: inputs.runner_type == 'vm' && inputs.os == 'netbsd'
        uses: vmactions/netbsd-vm@v1.4.5
        with:
          release: ${{ inputs.os_version }}
          usesh: true
          arch: ${{ inputs.arch }}
          prepare: ${{ inputs.prepare }}
          run: |
            /usr/sbin/pkg_add cmake gtk3+ pkgconf x11 libXext libXrender xproto libxcb
            export PKG_CONFIG_PATH=/usr/pkg/lib/pkgconfig:/usr/X11R7/lib/pkgconfig
            cmake -S . -B _build -DCMAKE_BUILD_TYPE=Release -DLIBUI_COMPILE_EXAMPLES=ON && cmake --build _build

      - name: Build and Test in DragonflyBSD
        if: inputs.runner_type == 'vm' && inputs.os == 'dragonflybsd'
        uses: vmactions/dragonflybsd-vm@v1.3.1
        with:
          release: ${{ inputs.os_version }}
          usesh: true
          prepare: ${{ inputs.prepare }}
          run: |
            pkg install -y cmake gtk3 pkgconf
            cmake -S . -B _build -DCMAKE_BUILD_TYPE=Release -DLIBUI_COMPILE_EXAMPLES=ON && cmake --build _build

      - name: Build and Test in Solaris
        if: inputs.runner_type == 'vm' && inputs.os == 'solaris'
        uses: vmactions/solaris-vm@v1.3.8
        with:
          release: ${{ inputs.os_version }}
          usesh: true
          prepare: ${{ inputs.prepare }}
          run: |
            export PKG_CONFIG_PATH=/usr/lib/64/pkgconfig
            pkg install -v --accept cmake gtk3 developer/build/pkg-config
            cmake -S . -B _build -DCMAKE_BUILD_TYPE=Release -DLIBUI_COMPILE_EXAMPLES=ON && cmake --build _build

      #~ - name: Upload coverage reports to Codecov
        #~ uses: codecov/codecov-action@v5
        #~ with:
          #~ token: ${{ secrets.CODECOV_TOKEN }}
          #~ root_dir: src
          #~ flags: ${{inputs.os}}, ${{inputs.arch}}, ${{ inputs.toolchain }}
          #~ name: ${{ inputs.platform_name }}-${{ inputs.arch }}-${{ inputs.toolchain }}
          #~ verbose: true

      - name: Record Build Status
        if: always()
        shell: bash
        run: echo ${{ job.status }} > ${{ inputs.platform_name }}-${{ inputs.arch }}-${{ inputs.toolchain }}-${{ inputs.link_type }}.result

      - name: Upload Build Status Artifact
        if: always()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: result-artifact-${{ inputs.platform_name }}-${{ inputs.arch }}-${{ inputs.toolchain }}-${{ inputs.link_type }}
          path: ${{ inputs.platform_name }}-${{ inputs.arch }}-${{ inputs.toolchain }}-${{ inputs.link_type }}.result
          retention-days: 1
